apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/owner: protogogos
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # ──────────────────────────────────────────────────────────────
    # INPUT — tail all container logs on this node
    # Tag format: kube.<namespace_name>.<pod_name>.<container_name>
    # ──────────────────────────────────────────────────────────────
    # multiline.parser cri reassembles containerd partial log lines (P/F flags)
    # so large records — e.g. a Java exception with a long stack trace — arrive
    # as a single JSON document instead of being split and dropped.
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        multiline.parser  cri
        Mem_Buf_Limit     20MB
        Buffer_Chunk_Size 512k
        Buffer_Max_Size   5M
        Skip_Long_Lines   On
        Refresh_Interval  10
        DB                /var/flb-db/flb_kube.db

    # ──────────────────────────────────────────────────────────────
    # Enrich ALL logs with Kubernetes metadata
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off

    # Promote node name to a flat top-level field
    [FILTER]
        Name    record_modifier
        Match   kube.*
        Record  node_name ${NODE_NAME}

    # ──────────────────────────────────────────────────────────────
    # All services emit single-line JSON to stdout with a real `level`
    # field (ERROR/WARN/INFO/DEBUG). The kubernetes filter above runs
    # Merge_Log On, which parses that JSON and promotes level/message/
    # timestamp/logger/service to top-level record fields. No per-service
    # parsing, multiline assembly, or content-based level guessing needed:
    # stack traces are carried inside the JSON `exception` field on one line.
    # ──────────────────────────────────────────────────────────────

    # ──────────────────────────────────────────────────────────────
    # Compute index name via Lua
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/index.lua
        call    set_index

    # ──────────────────────────────────────────────────────────────
    # OUTPUT — ship to OpenSearch
    # ──────────────────────────────────────────────────────────────
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch.logging.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix_Key opensearch_index
        Logstash_DateFormat %Y.%m.%d
        Suppress_Type_Name  On
        tls                 Off
        Retry_Limit         3

  parsers.conf: |
    # Strip the containerd/CRI prefix ("<time> <stream> <flag> <content>")
    # so the kubernetes filter's Merge_Log sees the bare JSON log content.
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

  index.lua: |
    function set_index(tag, timestamp, record)
        local ns = ""
        if record["kubernetes"] ~= nil and record["kubernetes"]["namespace_name"] ~= nil then
            ns = record["kubernetes"]["namespace_name"]
        end
        local svc = "unknown"
        if record["kubernetes"] ~= nil and
           record["kubernetes"]["labels"] ~= nil and
           record["kubernetes"]["labels"]["app.kubernetes.io/name"] ~= nil then
            svc = record["kubernetes"]["labels"]["app.kubernetes.io/name"]
        end
        record["opensearch_index"] = "logs-" .. ns .. "-" .. svc
        return 1, timestamp, record
    end
