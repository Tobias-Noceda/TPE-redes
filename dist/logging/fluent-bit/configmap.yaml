apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/owner: protogogos
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # ──────────────────────────────────────────────────────────────
    # INPUT — tail all container logs on this node
    # Tag format: kube.<namespace_name>.<pod_name>.<container_name>
    # ──────────────────────────────────────────────────────────────
    [INPUT]
        Name             tail
        Path             /var/log/containers/*.log
        Tag              kube.*
        Parser           cri
        Mem_Buf_Limit    10MB
        Skip_Long_Lines  On
        Refresh_Interval 10
        DB               /var/flb-db/flb_kube.db

    # ──────────────────────────────────────────────────────────────
    # Enrich ALL logs with Kubernetes metadata
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off

    # Promote node name to a flat top-level field
    [FILTER]
        Name    record_modifier
        Match   kube.*
        Record  node_name ${NODE_NAME}

    # ──────────────────────────────────────────────────────────────
    # Java multiline — assemble stack traces before level detection
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name              multiline
        Match             kube.*ui*
        multiline.parser  java_multiline

    [FILTER]
        Name              multiline
        Match             kube.*cart*
        multiline.parser  java_multiline

    [FILTER]
        Name              multiline
        Match             kube.*orders*
        multiline.parser  java_multiline

    # ──────────────────────────────────────────────────────────────
    # Level detection — set level=ERROR/WARN/INFO based on log text
    # Works for all services regardless of log format
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/level.lua
        call    set_level

    # ──────────────────────────────────────────────────────────────
    # Compute index name via Lua
    # ──────────────────────────────────────────────────────────────
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/index.lua
        call    set_index

    # ──────────────────────────────────────────────────────────────
    # OUTPUT — ship to OpenSearch
    # ──────────────────────────────────────────────────────────────
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch.logging.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix_Key opensearch_index
        Logstash_DateFormat %Y.%m.%d
        Suppress_Type_Name  On
        tls                 Off
        Retry_Limit         3

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        json_parser
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On

    [PARSER]
        Name        logback_parser
        Format      regex
        Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+(?<level>\w+)\s+(?<pid>\d+)\s+---\s+\[(?<thread>[^\]]+)\]\s+(?<logger>\S+)\s+:\s+(?<message>.*)$
        Time_Key    timestamp
        Time_Format %Y-%m-%d %H:%M:%S.%L
        Time_Keep   On

    [MULTILINE_PARSER]
        Name          java_multiline
        Type          regex
        Flush_Timeout 1000
        Rule          "start_state"    "/^\d{4}-\d{2}-\d{2}/"  "java_after_first"
        Rule          "java_after_first" "/^(\s+at |Caused by:|\.{3}\s+\d+\s+more)/" "java_after_first"

  level.lua: |
    function set_level(tag, timestamp, record)
        local log = record["log"] or ""
        local lower = string.lower(log)
        if string.find(lower, "error") then
            record["level"] = "ERROR"
        elseif string.find(lower, "warn") then
            record["level"] = "WARN"
        else
            record["level"] = "INFO"
        end
        return 1, timestamp, record
    end

  index.lua: |
    function set_index(tag, timestamp, record)
        local ns = ""
        if record["kubernetes"] ~= nil and record["kubernetes"]["namespace_name"] ~= nil then
            ns = record["kubernetes"]["namespace_name"]
        end
        local svc = "unknown"
        if record["kubernetes"] ~= nil and
           record["kubernetes"]["labels"] ~= nil and
           record["kubernetes"]["labels"]["app.kubernetes.io/name"] ~= nil then
            svc = record["kubernetes"]["labels"]["app.kubernetes.io/name"]
        end
        record["opensearch_index"] = "logs-" .. ns .. "-" .. svc
        return 1, timestamp, record
    end
