apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: logging
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: log-storage
    app.kubernetes.io/owner: protogogos
spec:
  serviceName: opensearch
  # Single node for dev/staging.
  # To cluster: set replicas: 3, remove discovery.type: single-node,
  # and add discovery.seed_hosts + cluster.initial_cluster_manager_nodes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: log-storage
        app.kubernetes.io/owner: protogogos
    spec:
      serviceAccountName: opensearch
      # OpenSearch requires vm.max_map_count=262144 on the host.
      # This init container sets it without requiring a privileged main container.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: cluster.name
              value: retail-store-logs
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name        # resolves to "opensearch-0"
            # Single-node mode: remove when scaling to replicas: 3
            - name: discovery.type
              value: single-node
            # Seed hosts for clustering (uncomment when replicas: 3)
            # - name: discovery.seed_hosts
            #   value: "opensearch-0,opensearch-1,opensearch-2"
            # - name: cluster.initial_cluster_manager_nodes
            #   value: "opensearch-0,opensearch-1,opensearch-2"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"          # raise to -Xms2g -Xmx2g for production
            # Disable TLS and auth for local/dev only
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 512m
              memory: 1Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
        labels:
          app.kubernetes.io/name: opensearch
          app.kubernetes.io/owner: protogogos
      spec:
        accessModes: ["ReadWriteOnce"]
        # "standard" is Kind's default StorageClass (local-path provisioner).
        # For production, replace with a network-attached StorageClass.
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi  # reduced for local dev; increase for staging/production
