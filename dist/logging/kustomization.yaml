apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All logging resources already carry namespace: logging in their metadata.
# This kustomization is referenced from the root as a sub-kustomization,
# so the root-level namespace field does NOT apply here.
resources:
  - namespace.yaml
  - fluent-bit/service-account.yaml
  - fluent-bit/cluster-role.yaml
  - fluent-bit/configmap.yaml
  - fluent-bit/daemonset.yaml
  - opensearch/service-account.yaml
  - opensearch/service.yaml
  - opensearch/statefulset.yaml
  - opensearch/dashboards/deployment.yaml
  - opensearch/dashboards/service.yaml
  - opensearch/dashboards/ingress.yaml
  - opensearch/dashboards/import-job.yaml

# Bundle the saved-object .ndjson files into a ConfigMap the import Job mounts.
# disableNameSuffixHash keeps the name stable ("dashboards-ndjson") so the Job
# can reference it directly.
configMapGenerator:
  - name: dashboards-ndjson
    namespace: logging
    files:
      - opensearch/dashboards/dashs/index-pattern.ndjson
      - opensearch/dashboards/dashs/dashboard-logs-por-servicio.ndjson
      - opensearch/dashboards/dashs/dashboard-errores.ndjson
      - opensearch/dashboards/dashs/dashboard-actividad-namespace-pod.ndjson

generatorOptions:
  disableNameSuffixHash: true
